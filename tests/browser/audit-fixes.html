<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>AutoCast 审计修复回归</title>
<style>
body{font:15px system-ui;margin:24px;color:#222;background:#f5f5f5}
#fixtures{min-height:180px}.boss-dialog,.greet-pop{width:320px;min-height:110px;padding:16px;border:1px solid #888;background:white}
button{padding:10px}pre{white-space:pre-wrap;background:white;padding:16px}
</style>
<h1>AutoCast 审计修复回归</h1>
<p>执行当前源码中的完整详情页触发函数。弹窗使用真实 DOM，时钟和平台回执由测试容器提供。</p>
<button id="run" disabled>运行回归</button><pre id="results">加载源码…</pre><div id="fixtures"></div>
<script type="module">
const [content, app] = await Promise.all([
  fetch('/content/content-main.js').then((r) => r.text()),
  fetch('/sidepanel/app.js').then((r) => r.text())
]);
function section(source, start, end) {
  const begin = source.indexOf(start), finish = source.indexOf(end, begin);
  if (begin < 0 || finish <= begin) throw new Error(`缺少源码函数 ${start}`);
  return source.slice(begin, finish).trim();
}
let clock = 1000, receipt = false, clicks = 0, scenario = '', scheduled = false;
let noticeClicks = 0;
const context = {
  document, window, getComputedStyle, MouseEvent, setTimeout,
  Date: { now: () => clock },
  location: { pathname: '/job_detail/fixture', href: 'https://fixture.invalid/job_detail/fixture', hash: '' },
  BHT_CONTENT_VERSION: '1.7.43',
  SELECTORS: { detailRoot: ['.job-detail'], title: ['.job-name'] },
  debugTrace: () => {}, serializeDebugError: (error) => String(error),
  describeDebugElement: (element) => ({ text: element?.textContent || '' }), pageInfo: () => ({}),
  findExistingBossJobSwitchDialog: () => null, skipExistingBossJobSwitch: () => null,
  detectLoginModal: () => ({ ok: false }), detectNonChatJob: () => null,
  clickStayOnListDialog: () => ({ ok: true }),
  closeSubscribeDialogAndConfirmConversation: async () => ({ closed: false, available: false }),
  extractDetailHrName: () => 'Fixture HR', extractDetailCompany: () => 'Fixture Company',
  isConversationNavigationStarted: () => false,
  findNativeGreetingReceipt: () => receipt ? { at: clock, hasShowGreeting: true, showGreeting: true, greeting: 'hello' } : null,
  sleep: async (ms) => {
    clock += ms;
    if (!scheduled && ((scenario === 'hard-delayed' && clock >= 1300) ||
      (scenario === 'hard-retry-delayed' && clicks === 2 && clock >= 4500))) {
      scheduled = true; showHard();
    }
    if (!scheduled && scenario === 'near-delayed' && clock >= 1300) {
      scheduled = true; showNear('您今天已与\n120 位\nBOSS\n沟通，还剩\n30 次沟通机会哦');
    }
  }
};
const functions = [
  section(content, 'function textOf(', '// BOSS 薪资常用'),
  section(content, 'function firstEl(', 'function allEl('),
  section(content, 'function clickLikeHuman(', 'function normalizeText('),
  section(content, 'function findConversationActionButton(', 'function detectNonChatJob('),
  section(content, 'function detectBossDailyLimitModal(', '// BOSS 在接近每日上限'),
  section(content, 'function findBossCommunicationQuotaNotice(', 'async function closeBossCommunicationQuotaNotice('),
  section(content, 'async function closeBossCommunicationQuotaNotice(', 'async function waitForBossCommunicationQuotaNotice('),
  section(content, 'async function waitForNativeGreetingReceipt(', 'function buildTriggerNavigationRecovery('),
  section(content, 'function dismissCommonDialogs(', 'function isChatPage('),
  section(content, 'async function triggerConversationOnWorkerDetail(', 'async function triggerConversationOnList(')
].join('\n');
const api = new Function(...Object.keys(context), `${functions}
return {triggerConversationOnWorkerDetail, detectBossDailyLimitModal, findBossCommunicationQuotaNotice, closeBossCommunicationQuotaNotice, dismissCommonDialogs};`
)(...Object.values(context));
function fixture(name) {
  clock = 1000; receipt = false; clicks = 0; noticeClicks = 0; scheduled = false; scenario = name;
  document.querySelector('#fixtures').innerHTML = '<div class="job-detail"><h1 class="job-name">Fixture Job</h1><button class="op-btn-chat">立即沟通</button></div>';
  document.querySelector('.op-btn-chat').addEventListener('click', () => {
    clicks++;
    if (scenario === 'hard-first' || (scenario === 'hard-retry' && clicks === 2)) showHard();
    if (scenario === 'near-first' || scenario === 'near-blocked') showNear('您今天已与 120 位 BOSS 沟通，还剩 30 次沟通机会哦');
    if (scenario === 'success') receipt = true;
  });
}
function showHard() {
  const element = document.createElement('div'); element.className = 'boss-dialog';
  element.innerHTML = '<h2>您已达到沟通上限</h2><p>休息一下，明天再来吧</p><button>确定</button>';
  element.querySelector('button').addEventListener('click', () => element.remove());
  document.querySelector('#fixtures').appendChild(element);
}
function showNear(text) {
  const element = document.createElement('div'); element.className = 'greet-pop';
  const p = document.createElement('p'); p.textContent = text; element.appendChild(p);
  const confirm = document.createElement('button'); confirm.className = 'btn-sure'; confirm.textContent = '好'; element.appendChild(confirm);
  confirm.addEventListener('click', () => {
    noticeClicks++;
    if (scenario === 'near-blocked') return;
    element.remove(); receipt = true;
  });
  document.querySelector('#fixtures').appendChild(element);
}
const results = [];
function record(name, actual, ok) { results.push({ name, actual, ok }); }
async function run() {
  results.length = 0;
  for (const [name, expectedClicks] of [
    ['hard-initial', 0], ['hard-first', 1], ['hard-delayed', 1], ['hard-retry', 2], ['hard-retry-delayed', 2]
  ]) {
    fixture(name); if (name === 'hard-initial') showHard();
    const result = await api.triggerConversationOnWorkerDetail({ jobId: 'fixture' });
    record(name, { error: result.error, clicks, visible: api.detectBossDailyLimitModal().ok },
      result.error === 'BOSS_DAILY_LIMIT' && clicks === expectedClicks && api.detectBossDailyLimitModal().ok);
  }
  fixture('cleanup'); document.querySelector('.op-btn-chat').textContent = '继续沟通';
  api.dismissCommonDialogs(); record('普通继续沟通按钮不被清理点击', { clicks }, clicks === 0);
  for (const text of [
    '您今天已与120位BOSS沟通，还剩30次沟通机会哦',
    '您今天已与 120 位 BOSS 沟通，还剩 30 次沟通机会哦',
    '您今天已与\n120 位\nBOSS\n沟通，还剩\n30 次沟通机会哦'
  ]) {
    fixture('notice'); showNear(text);
    const detected = Boolean(api.findBossCommunicationQuotaNotice());
    const closed = await api.closeBossCommunicationQuotaNotice();
    record('提醒文字：' + JSON.stringify(text), { detected, closed: closed.closed, noticeClicks }, detected && closed.closed && noticeClicks === 1);
  }
  for (const name of ['near-first', 'near-delayed', 'success', 'near-blocked', 'no-effect']) {
    fixture(name);
    const result = await api.triggerConversationOnWorkerDetail({ jobId: 'fixture' });
    const expected = name === 'near-blocked' ? 'CONVERSATION_CREATE_NOT_CONFIRMED' :
      name === 'no-effect' ? 'WORKER_CHAT_CLICK_NO_EFFECT' : undefined;
    record(name, { ok: result.ok, error: result.error, clicks }, result.error === expected && clicks === (name === 'no-effect' ? 2 : 1));
  }
  for (const [unlimited, bytes, expected] of [[true, 10, true], [true, 41, false], [false, 10, false]]) {
    const chrome = { permissions: { contains: async () => unlimited }, storage: { local: {
      QUOTA_BYTES: 10485760, getBytesInUse: async () => 0
    } } };
    const capacity = new Function('chrome', 'globalThis', 'getJsonBytes',
      `return (${section(app, 'async function assertResumeStorageCapacity(', 'async function fileToCompressedDataUrl(')});`
    )(chrome, { chrome }, (value) => new Blob([JSON.stringify(value)]).size);
    let accepted = true, error = '';
    try { await capacity({ profiles: [{ images: [{ dataUrl: 'A'.repeat(bytes * 1024 * 1024) }] }] }); }
    catch (e) { accepted = false; error = String(e.message); }
    record(`简历容量 ${bytes}MiB，unlimited=${unlimited}`, { accepted, error }, accepted === expected);
  }
  const output = { status: 'complete', passed: results.filter((r) => r.ok).length, failed: results.filter((r) => !r.ok).length, cases: results };
  document.querySelector('#results').textContent = JSON.stringify(output, null, 2);
  document.querySelector('#results').dataset.status = 'complete';
}
document.querySelector('#run').disabled = false;
document.querySelector('#results').textContent = '源码已加载';
document.querySelector('#run').addEventListener('click', () => run().catch((e) => {
  document.querySelector('#results').textContent = String(e.stack);
  document.querySelector('#results').dataset.status = 'error';
}));
</script>
</html>
