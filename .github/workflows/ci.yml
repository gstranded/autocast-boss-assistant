name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit and flow tests
        run: npm test
      - name: Smoke tests
        run: npm run smoke
